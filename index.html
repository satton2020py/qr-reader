<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>QRリーダー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="scanner">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame" aria-hidden="true"><span></span></div>
  <p id="status" class="status">カメラを起動しています…</p>
  <button id="torch" class="round torch" hidden aria-pressed="false" aria-label="ライト">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8l-1.5 6H9.5z M9.5 8h5v4l-1.5 2v8h-2v-8l-1.5-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>ライト</span>
  </button>
  <div id="zoomBox" class="zoom" hidden>
    <span id="zoomLabel" class="zoom-label">1.0x</span>
    <input id="zoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="ズーム">
  </div>
  <div class="bar">
    <label class="btn" for="file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M4 15l4-4 4 4 3-3 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="15.5" cy="9" r="1.5" fill="currentColor"/></svg>
      画像から読む
    </label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="openHistory" class="btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      履歴
    </button>
    <button id="retry" class="btn" hidden>カメラを再起動</button>
  </div>
</main>

<section id="sheet" class="sheet" hidden aria-live="polite">
  <div class="sheet-inner">
    <p id="kind" class="kind"></p>
    <h2 id="title" class="title"></h2>
    <dl id="fields" class="fields"></dl>
    <div id="actions" class="actions"></div>
    <button id="close" class="link">続けてスキャン</button>
  </div>
</section>

<section id="history" class="history" hidden>
  <header class="history-head">
    <h2>履歴</h2>
    <button id="closeHistory" class="btn">閉じる</button>
  </header>
  <div class="history-tools">
    <button id="exportCsv" class="btn primary">CSVで保存</button>
    <button id="clearHistory" class="btn">すべて削除</button>
  </div>
  <p id="historyEmpty" class="empty">まだ履歴はありません。読み取った内容はここに残ります。</p>
  <ul id="historyList" class="history-list"></ul>
</section>

<div id="toast" class="toast" hidden></div>
<canvas id="canvas" hidden></canvas>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
